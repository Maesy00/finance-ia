<!doctype html>
<html lang="fr" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Finance.ia</title>
  <meta name="description" content="Tes flux, tes biens immobiliers, tes dépenses communes et ton épargne.">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="images/favicon-32.png">
  <link rel="apple-touch-icon" href="images/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Finance.ia">
  <meta name="theme-color" content="#ffffff">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/regular/style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/fill/style.css">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="auth-gate">
    <div class="auth-card">
      <img class="auth-logo" src="images/icon-192.png" alt="" width="64" height="64">
      <h1 class="large-title" id="auth-title">Connexion</h1>
      <p class="auth-subtitle">Finance.ia — tes flux et ton épargne, synchronisés partout. Un compte propre à cette app.</p>

      <form id="auth-form">
        <label class="field">
          <span class="visually-hidden">Email</span>
          <input class="input" type="email" id="auth-email" placeholder="Email" required autocomplete="email">
        </label>
        <label class="field">
          <span class="visually-hidden">Mot de passe</span>
          <input class="input" type="password" id="auth-password" placeholder="Mot de passe" required autocomplete="current-password" minlength="6">
        </label>
        <p id="auth-error" class="auth-message error" hidden></p>
        <p id="auth-info" class="auth-message info" hidden></p>
        <button type="submit" class="btn btn-primary btn-block" id="auth-submit-btn">Se connecter</button>
      </form>

      <p class="auth-switch">
        <span id="auth-switch-text">Pas encore de compte ?</span>
        <button type="button" id="auth-toggle-mode">Créer un compte</button>
      </p>
    </div>
  </div>

  <div id="app-shell" hidden>
    <main class="screens">
      <header class="topbar">
        <div class="brand">
          <img class="brand-mark" src="images/icon-192.png" alt="" width="28" height="28">
          <span class="brand-name">Finance.ia</span>
        </div>
        <div class="topbar-actions">
          <button type="button" id="btn-settings" class="icon-btn" aria-label="Réglages">
            <i class="ph ph-gear-six" aria-hidden="true"></i>
          </button>
          <button type="button" id="sign-out-btn" class="icon-btn" aria-label="Se déconnecter">
            <i class="ph ph-sign-out" aria-hidden="true"></i>
          </button>
        </div>
      </header>

      <!-- ================= FLUX ================= -->
      <section id="view-flows" class="screen tab-panel active" aria-label="Flux">
        <h1 class="large-title screen-title">Flux</h1>
        <div class="filters-bar">
          <select class="input" id="filter-type" aria-label="Filtrer par type">
            <option value="all">Tous les types</option>
            <option value="credit">Crédit</option>
            <option value="debit_obligatoire">Débit obligatoire</option>
            <option value="debit_facultatif">Débit facultatif</option>
            <option value="epargne">Épargne</option>
          </select>
          <select class="input" id="filter-account" aria-label="Filtrer par compte"></select>
        </div>
        <div id="flows-summary"></div>
        <button type="button" id="btn-new-flow" class="btn btn-primary btn-block">
          <i class="ph ph-plus" aria-hidden="true"></i>Nouveau flux
        </button>
        <div id="flows-list" class="card-list"></div>
        <p id="flows-empty" class="placeholder hidden">Aucun flux pour ces filtres.</p>
      </section>

      <!-- ================= BIENS ================= -->
      <section id="view-properties" class="screen tab-panel" aria-label="Biens">
        <h1 class="large-title screen-title">Biens</h1>
        <div class="chip-row" id="property-tabs"></div>
        <div id="property-summary"></div>
        <div id="property-flows-list" class="card-list"></div>
        <button type="button" id="btn-manage-properties" class="btn btn-secondary btn-sm btn-block">Gérer les biens</button>
      </section>

      <!-- ================= COMMUN ================= -->
      <section id="view-commun" class="screen tab-panel" aria-label="Commun">
        <h1 class="large-title screen-title">Commun</h1>
        <div id="commun-content" class="stack"></div>
      </section>

      <!-- ================= TRÉSORERIE ================= -->
      <section id="view-treasury" class="screen tab-panel" aria-label="Trésorerie">
        <h1 class="large-title screen-title">Trésorerie</h1>
        <div id="treasury-content" class="stack"></div>
      </section>

      <!-- ================= ÉPARGNE ================= -->
      <section id="view-savings" class="screen tab-panel" aria-label="Épargne">
        <h1 class="large-title screen-title">Épargne</h1>
        <div class="period-nav">
          <button type="button" id="savings-month-prev" class="icon-btn" aria-label="Mois précédent">
            <i class="ph ph-caret-left" aria-hidden="true"></i>
          </button>
          <span id="savings-month-label" class="period-nav-label"></span>
          <button type="button" id="savings-month-next" class="icon-btn" aria-label="Mois suivant">
            <i class="ph ph-caret-right" aria-hidden="true"></i>
          </button>
        </div>
        <div id="savings-total-card" class="card hero-card"></div>
        <div id="savings-accounts-list"></div>
        <button type="button" id="btn-manage-savings" class="btn btn-secondary btn-sm btn-block">Gérer les supports d'épargne</button>
        <div class="card">
          <h2 class="card-title">Évolution du total</h2>
          <div id="savings-chart"></div>
        </div>
      </section>
    </main>

    <div id="modal-root"></div>

    <nav class="tabbar" role="tablist" aria-label="Navigation">
      <button type="button" class="tab nav-btn active" role="tab" data-view="flows" aria-selected="true">
        <i class="ph ph-swap" aria-hidden="true"></i><i class="ph-fill ph-swap" aria-hidden="true"></i>Flux
      </button>
      <button type="button" class="tab nav-btn" role="tab" data-view="properties" aria-selected="false">
        <i class="ph ph-house" aria-hidden="true"></i><i class="ph-fill ph-house" aria-hidden="true"></i>Biens
      </button>
      <button type="button" class="tab nav-btn" role="tab" data-view="commun" aria-selected="false">
        <i class="ph ph-users" aria-hidden="true"></i><i class="ph-fill ph-users" aria-hidden="true"></i>Commun
      </button>
      <button type="button" class="tab nav-btn" role="tab" data-view="treasury" aria-selected="false">
        <i class="ph ph-wallet" aria-hidden="true"></i><i class="ph-fill ph-wallet" aria-hidden="true"></i>Trésorerie
      </button>
      <button type="button" class="tab nav-btn" role="tab" data-view="savings" aria-selected="false">
        <i class="ph ph-piggy-bank" aria-hidden="true"></i><i class="ph-fill ph-piggy-bank" aria-hidden="true"></i>Épargne
      </button>
    </nav>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/calc.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/app.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
